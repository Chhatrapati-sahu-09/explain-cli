[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "explain-cli"
version = "0.1.0"
description = "Explains and risk-scores any shell command"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "bashlex>=0.18",
]
 
[project.scripts]
explain = "explain.cli:main"
 
[tool.setuptools.packages.find]
where = ["."]
include = ["explain*"]
