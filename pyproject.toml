[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "explain-cli"
version = "0.1.0"
description = "Explains and risk-scores any shell command before you run it"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "shell", "security", "devtools", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Shells",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "bashlex>=0.18",
    "httpx>=0.25",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.25",
]

[project.scripts]
explain = "explain.cli:main"

[project.urls]
Homepage   = "https://github.com/YOUR_USERNAME/explain-cli"
Repository = "https://github.com/YOUR_USERNAME/explain-cli"
Issues     = "https://github.com/YOUR_USERNAME/explain-cli/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["explain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
